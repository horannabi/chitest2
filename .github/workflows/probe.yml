name: probe

# GitHub Actions 러너에서 CGV 에 닿는지 방식별로 진단한다. (수동 실행)
# 결과는 probe.txt 로 커밋된다.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests curl_cffi playwright

      - run: playwright install --with-deps chromium

      # headed 모드 진단을 위해 가상 디스플레이로 실행한다
      - run: sudo apt-get install -y xvfb

      - run: xvfb-run -a python probe.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probe.txt
          git diff --staged --quiet || git commit -m "probe result"
          git pull --rebase --autostash
          git push
